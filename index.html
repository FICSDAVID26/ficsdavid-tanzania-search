
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FICSDavid Tanzania Search</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f4f7fb;
  color: #172033;
}

header {
  background: #073b70;
  color: white;
  padding: 22px 15px;
  text-align: center;
}

header h1 {
  margin: 0;
  font-size: 25px;
}

header p {
  margin-bottom: 0;
}

main {
  max-width: 650px;
  margin: 35px auto;
  padding: 20px;
}

.search-box {
  background: white;
  padding: 25px;
  border-radius: 12px;
  box-shadow: 0 3px 12px #0001;
}

h2 {
  text-align: center;
  color: #073b70;
}

input, select, button {
  width: 100%;
  padding: 14px;
  margin: 9px 0;
  border-radius: 7px;
  font-size: 16px;
}

input, select {
  border: 1px solid #ccc;
}

button {
  background: #087c45;
  color: white;
  border: none;
  font-weight: bold;
  cursor: pointer;
}

#result {
  margin-top: 20px;
  padding: 15px;
  background: #edf5ff;
  border-radius: 8px;
  text-align: center;
}

footer {
  text-align: center;
  padding: 20px;
  color: #555;
}
</style>
</head>

<body>

<header>
  <h1>FICSDavid Tanzania Search</h1>
  <p>Discover Tanzania. Find Information. Connect the World.</p>
</header>

<main>
  <div class="search-box">

    <h2>Search Tanzania</h2>

    <p>Welcome to FICSDavid Tanzania Search.</p>

    <input
      type="search"
      id="search"
      placeholder="What are you looking for?"
    >

    <select id="region">
      <option value="">All Regions</option>
      <option>Dar es Salaam</option>
      <option>Mwanza</option>
      <option>Dodoma</option>
      <option>Arusha</option>
      <option>Geita</option>
      <option>Mbeya</option>
      <option>Morogoro</option>
    </select>

    <button onclick="searchTanzania()">
      Search
    </button>

    <div id="result">
      Your search results will appear here.
    </div>

  </div>
</main>

<footer>
  <p>FICSDavid Tanzania Search</p>
  <p>Founder: David Laurent Mabula</p>
  <p>Building a smarter digital Tanzania.</p>
</footer>

<script>
function searchTanzania() {
  const query = document.getElementById("search").value;
  const region = document.getElementById("region").value;
  const result = document.getElementById("result");

  if (query.trim() === "") {
    result.innerHTML = "Please enter something to search.";
    return;
  }

  result.innerHTML =
    "<strong>Search received!</strong><br>" +
    "Keyword: " + query +
    "<br>Region: " + (region || "All Regions") +
    "<br><br>Our Tanzania search engine is under development.";
}
</script>

</body>
</html>
