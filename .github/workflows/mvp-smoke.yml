name: FICSDavid MVP smoke tests

on:
  push:
    branches: [main, feat/provider-integration-foundation]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run MVP smoke tests
        run: node --test tests/mvp-smoke.test.mjs
      - name: Run provider integration foundation tests
        run: node --test tests/provider-registry.test.mjs tests/provider-adapter-contract.test.mjs
